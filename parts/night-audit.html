<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Night Audit</title>
<style>
:root{--ink:#efe6d6;--dim:#a99c86;--bg:#0b0907;--accent:#d9b36c}

#veil{position:fixed;inset:0;display:grid;place-items:center;text-align:center;background:#0b0907e6;padding:16px;z-index:20}
#veil.hidden{display:none}#veil h1{font-weight:normal;letter-spacing:.2em;text-transform:uppercase;margin:0 0 14px;font-size:26px}

</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<canvas id="c"></canvas><div id="hud"></div>
<div id="veil"><div><h1 id="title">Night Audit</h1><p id="lead">A phone is ringing somewhere in the hotel. The hallways were not like this yesterday.</p><p id="sub">Follow the ringing. WASD or arrows to walk, mouse or drag to look, Shift to hurry. Headphones help.</p><button id="go" disabled>Loading…</button><p id="status"></p></div></div>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const PARTS={/*PARTS*/};
const $=id=>document.getElementById(id);
async function load(id){const res=await fetch(PARTS[id]);if(!res.ok)throw Error('Could not load '+id);const {js}=await res.json();return import('data:text/javascript;charset=utf-8,'+encodeURIComponent(js));}
const [worldgen,hotelGen,mesher,fps,touch]=await Promise.all(['worldgen','hotel-wfc','socket-mesher','fps-controls','touch-controls'].map(load));

const CELL=2.6,STOREY=2.8,R=.28,DOOR=.5,EYE=1.6,DX=[0,1,0,-1],DY=[-1,0,1,0];
const seed=Number(new URLSearchParams(location.search).get('seed'))||Math.floor(Math.random()*1e6);
let night=0,hotel,by,group,goalDist,phone,beacon,pos={x:0,z:0},layer=0,height=0,mode='loading',ringOn=true,last=performance.now(),answered=0;

// ---------- renderer, materials, pieces ----------
const renderer=new THREE.WebGLRenderer({canvas:$('c'),antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(70,1,.05,20);camera.rotation.order='YXZ';
scene.background=new THREE.Color(0x0b0907);scene.fog=new THREE.FogExp2(0x0b0907,.12);
scene.add(new THREE.HemisphereLight(0xffe2b8,0x6b5a44,.7));
const torch=new THREE.SpotLight(0xfff1d6,22,16,.55,.5,1.6);torch.position.set(0,0,0);camera.add(torch);torch.target.position.set(0,-.15,-1);camera.add(torch.target);scene.add(camera);
const loader=new THREE.TextureLoader();
const tex=(id,srgb,rep=1)=>{const t=loader.load(PARTS[id]);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rep,rep);t.anisotropy=4;if(srgb)t.colorSpace=THREE.SRGBColorSpace;return t;};
// Heartland Inn's surfaces: navy loop-pile corridor carpet (ambientCG Fabric022), greige plaster, a terracotta wall behind
// each bed, bright acoustic tile, tinted walnut. Repeats are whole numbers per cell so tiles meet across cells.
const hallCarpet=tex('acg-hotel-carpet-color',true,5),hallCarpetN=tex('acg-hotel-carpet-normal',false,5),hallCarpetR=tex('acg-hotel-carpet-roughness',false,5);
const carpet=tex('ph-hotel-carpet-color',true,2),carpetN=tex('ph-hotel-carpet-normal',false,2),plasterN=tex('ph-hotel-wall-plaster-normal',false,2),ceilingC=tex('acg-hotel-ceiling-color',true,4),walnut=tex('ph-hotel-walnut-color',true);
const plaster=color=>new THREE.MeshStandardMaterial({color,normalMap:plasterN,normalScale:new THREE.Vector2(.18,.18),roughness:.9});
const mat={
  hallFloor:new THREE.MeshStandardMaterial({map:hallCarpet,normalMap:hallCarpetN,roughnessMap:hallCarpetR,color:0xb4c6ff}),
  roomFloor:new THREE.MeshStandardMaterial({map:carpet,normalMap:carpetN,color:0xb8ab94,roughness:.95}),
  wall:plaster(0xd8d0c0),roomWall:plaster(0xdccfb7),accent:plaster(0xa66d50),
  ceiling:new THREE.MeshStandardMaterial({map:ceilingC,emissiveMap:ceilingC,emissive:0x2a2826,roughness:1}),
  wood:new THREE.MeshStandardMaterial({map:walnut,color:0xc9a27e,roughness:.9}),
  frame:new THREE.MeshStandardMaterial({color:0x2a2119,roughness:.5,metalness:.2}),
  art:new THREE.MeshStandardMaterial({color:0x4a5a52,roughness:.8}),
  glow:new THREE.MeshStandardMaterial({color:0x332211,emissive:0xffc77a,emissiveIntensity:2.2}),
  panel:new THREE.MeshStandardMaterial({color:0x222222,emissive:0xfff3dc,emissiveIntensity:1.4}),
  phone:new THREE.MeshStandardMaterial({color:0x7a1612,roughness:.4}),
};
// Heartland Inn's furniture (original Blender models, CC0), all authored floor-centred and facing +z.
// Plus photoscanned Poly Haven models (CC0, real scale, facing +z) for the things that make it feel lived in.
const MODELS=['hotel-room-door','hotel-king-bed-lite','hotel-nightstand','hotel-table-lamp','hotel-credenza-tv','hotel-snack-vending-lite','hotel-ice-machine','hotel-housekeeping-cart','ph-wetfloorsign-01',
  'ph-hanging-picture-frame-02-lite','ph-korean-fire-extinguisher-01-lite','ph-wall-clock-lite','ph-vintage-grandfather-clock-01-lite','ph-sofa-02','ph-plastic-monobloc-chair-01','ph-armchair-01-lite','ph-side-table-01-lite','ph-pull-chain-light-socket-lite','ph-lightbulb-01-lite'];
let loadedModels=0;const gltf=new GLTFLoader();
const models=Object.fromEntries(await Promise.all(MODELS.map(id=>gltf.loadAsync(PARTS[id]).then(g=>{$('go').textContent=`Loading furniture ${++loadedModels}/${MODELS.length}`;return[id,g.scene];}))));
// glTF glass loads as transmission, and one transmissive material makes three.js render the whole opaque scene a second
// time every frame. Plain transparency looks the same on a clock face or a bulb.
// Poly Haven's frame and clock glass is also authored opaque black, which hides what's behind it: make all glass see-through.
for(const m of Object.values(models))m.traverse(o=>{const x=o.material;if(x&&(x.transmission>0||/glass/i.test(x.name)))Object.assign(x,{transmission:0,transparent:true,opacity:Math.min(x.opacity,.25),depthWrite:false});});
const bulb=new THREE.Group();bulb.add(models['ph-pull-chain-light-socket-lite'],models['ph-lightbulb-01-lite']);models['ph-lightbulb-01-lite'].position.y=-.25; // a bare bulb on its socket
const doorFrame=models['hotel-room-door'].clone();doorFrame.getObjectByName('door_leaf').removeFromParent();
const doorLeaf=models['hotel-room-door'].getObjectByName('door_leaf').clone();doorLeaf.position.set(0,0,0); // hinge at the origin
const H=CELL/2,STEPS=10,side=H-DOOR,G={
  plane:(w,h)=>new THREE.PlaneGeometry(w,h),box:(w,h,d)=>new THREE.BoxGeometry(w,h,d),
};
const pieces={
  'hall-floor':{geometry:G.plane(CELL,CELL).rotateX(-Math.PI/2),material:mat.hallFloor},
  'room-floor':{geometry:G.plane(CELL,CELL).rotateX(-Math.PI/2),material:mat.roomFloor},
  // 2 cm under the floor above, or the undersides of upstairs furniture and baseboards z-fight through it
  'ceiling':{geometry:G.plane(CELL,CELL).rotateX(Math.PI/2).translate(0,STOREY-.02,0),material:mat.ceiling},
  'wall':{geometry:G.plane(CELL,STOREY).translate(0,STOREY/2,-H),material:mat.wall},
  'room-wall':{geometry:G.plane(CELL,STOREY).translate(0,STOREY/2,-H),material:mat.roomWall},
  'base':{geometry:G.box(CELL,.12,.02).translate(0,.06,-H+.01),material:mat.wood},
  'door-side':{geometry:G.plane(side,STOREY).translate(0,STOREY/2,-H),material:mat.wall},
  'door-top':{geometry:G.plane(DOOR*2,STOREY-2.1).translate(0,2.1+(STOREY-2.1)/2,-H),material:mat.wall},
  'door-frame':doorFrame,'door-leaf':doorLeaf,
  'accent-wall':{geometry:G.plane(CELL,STOREY).translate(0,STOREY/2,-H),material:mat.accent},
  'sconce':{geometry:G.box(.16,.24,.07).translate(0,1.85,-H+.04),material:mat.glow},
  'picture':{geometry:G.box(.62,.46,.03).translate(0,1.5,-H+.02),material:mat.frame},
  'canvas':{geometry:G.plane(.52,.36).translate(0,1.5,-H+.036),material:mat.art},
  'print':{geometry:G.plane(.68,.44).translate(0,1.52,-H+.012),material:mat.art},
  'light-panel':{geometry:G.plane(.55,.55).rotateX(Math.PI/2).translate(0,STOREY-.03,0),material:mat.panel},
  'step':{geometry:G.box(CELL-.04,STOREY/STEPS,CELL/STEPS),material:mat.wood},
  'bed':models['hotel-king-bed-lite'],'nightstand':models['hotel-nightstand'],'lamp':models['hotel-table-lamp'],'credenza':models['hotel-credenza-tv'],
  'art':models['ph-hanging-picture-frame-02-lite'],'extinguisher':models['ph-korean-fire-extinguisher-01-lite'],'clock':models['ph-wall-clock-lite'],'grandfather':models['ph-vintage-grandfather-clock-01-lite'],
  'sofa':models['ph-sofa-02'],'chair':models['ph-plastic-monobloc-chair-01'],'armchair':models['ph-armchair-01-lite'],'side-table':models['ph-side-table-01-lite'],'bulb':bulb,
  'vending':models['hotel-snack-vending-lite'],'ice':models['hotel-ice-machine'],'cart':models['hotel-housekeeping-cart'],'wet-sign':models['ph-wetfloorsign-01'],
};
// A king bed against the north wall of each room's north-west corner, head to the wall, with a nightstand and lamp
// either side (Heartland's spacing); shifted east when the door is in the west wall. A TV credenza on the south wall.
const bedX=t=>t.base==='room-corner-door-side'?.8:.4;
const BED=x=>[{piece:'bed',at:[x,0,-H+1.18]},...[-1.4,1.4].flatMap(dx=>[{piece:'nightstand',at:[x+dx,0,-H+.25]},{piece:'lamp',at:[x+dx,.56,-H+.25]}])];
const hasBed=t=>t.rotation===0&&(t.base==='room-corner'||t.base==='room-corner-door-side');
const hasTV=t=>t.rotation===3&&(t.base==='room-corner'||t.base==='room-corner-door'); // local west wall is the room's south wall
// Footprints in each model's own frame, from its measured bounds: what the player can't walk through.
const SOLID={bed:[-1.12,1.12,-1.01,1.14],nightstand:[-.26,.26,-.21,.23],credenza:[-1.3,1.3,-.25,.25],vending:[-.49,.49,-.43,.44],ice:[-.3,.3,-.33,.35],cart:[-.63,1.09,-.25,.25],'wet-sign':[-.15,.15,-.19,.17],grandfather:[-.31,.31,-.19,.24],sofa:[-.9,.9,-.48,.34],chair:[-.32,.32,-.34,.29],armchair:[-.42,.42,-.42,.35],'side-table':[-.28,.28,-.23,.23]};

function rules(){return{cell:CELL,storey:STOREY,only:hotel.reached,seed:hotel.world.seed,
  inside({tile,random}){
    const k=hotelGen.kind(tile),out=[];
    if(k!=='stair-high')out.push(k==='room'?'room-floor':'hall-floor');
    if(k!=='stair-low')out.push('ceiling');
    if(k==='corridor'&&random()<.4)out.push('light-panel');
    if(k==='stair-low')for(let s=0;s<STEPS;s++)out.push({piece:'step',at:[0,(s+.5)*STOREY/STEPS,H-(s+.5)*CELL/STEPS]});
    if(k==='room'&&hasBed(tile))out.push(...BED(bedX(tile)));
    if(k==='room'&&hasTV(tile))out.push({piece:'credenza',at:[-H+.27,0,.1],rot:Math.PI/2});
    if(tile.base==='end'){const r=random();out.push(r<.4?{piece:'vending',at:[0,0,H-.48],rot:Math.PI}:r<.7?{piece:'ice',at:[0,0,H-.38],rot:Math.PI}:{piece:'grandfather',at:[0,0,H-.25],rot:Math.PI});}
    if(tile.base==='tee'&&random()<.35)out.push({piece:'sofa',at:[-H+.5,0,0],rot:Math.PI/2});
    if(k==='room'&&tile.base==='room-corner'&&tile.rotation===2)out.push({piece:'armchair',at:[-H+.55,0,-H+.55],rot:Math.PI/4},{piece:'side-table',at:[-H+.32,0,-H+1.3]});
    if(k==='stair-high')out.push({piece:'bulb',at:[0,STOREY-.02,0]});
    if(tile.base==='hall'){const r=random();if(r<.06)out.push({piece:'cart',at:[H-.3,0,0],rot:Math.PI/2});else if(r<.11)out.push({piece:'wet-sign',at:[-.5,0,.2],rot:random()*6});else if(r<.14)out.push({piece:'chair',at:[-.45,0,.35],rot:random()*6});}
    return out;
  },
  // walls: sconces, Poly Haven frames (empty, so each gets a muted print behind its glass), extinguishers, clocks
  face({socket,tile,other,i,j,d,random}){
    const room=hotelGen.kind(tile)==='room',wall=room?(hasBed(tile)&&d===0?'accent-wall':'room-wall'):'wall';
    if(socket==='w'||!other){const out=[wall,'base'],r=random();if(!room&&r<.12)out.push('sconce');else if(r<.24)out.push({piece:'art',at:[0,1.55,-H]},'print');else if(!room&&r<.27)out.push({piece:'extinguisher',at:[0,0,-H+.13]});else if(r<.29)out.push({piece:'clock',at:[0,2.05,-H]});return out;}
    if(socket==='d'){const out=[{piece:'door-side',at:[-(DOOR+side/2),0,0]},{piece:'door-side',at:[DOOR+side/2,0,0]},'door-top'];
      // one Heartland door per doorway, its face to the corridor, swung open into the room
      const k=hotelGen.kind(tile),ko=hotelGen.kind(other),front=(k==='corridor'&&ko!=='corridor')||(k===ko&&i<j);
      if(front)out.push({piece:'door-frame',at:[0,0,-H]},{piece:'door-leaf',at:[-DOOR,0,-H],rot:1.25+random()*.45});return out;}
    return [];
  }};}

// ---------- the hotel ----------
function buildNight(){
  if(group){scene.remove(group);group.userData.dispose();}
  hotel=hotelGen.generate({seed:worldgen.hash(seed,night),width:14,height:14,floors:2,...worldgen});
  by=new Map(hotel.tiles.map(t=>[t.id,t]));
  roomOf=rooms();
  const where=placed=mesher.placements(hotel.world,hotel.tiles,rules());group=mesher.build(where,pieces,{chunk:(o,name)=>!FURNITURE.includes(name)?null:roomOf[o.cell]>=0?'room'+roomOf[o.cell]:[o.x,o.y,o.z].map(v=>Math.floor(v/(CELL*3))).join()});scene.add(group);
  near=group.children.filter(m=>FURNITURE.includes(m.name)); // furniture blocks, shown by room or distance in frame()
  colliders=mesher.footprints(where,SOLID).map(c=>({l:Math.round(c.y/STOREY),x0:c.x0-R,x1:c.x1+R,z0:c.z0-R,z1:c.z1+R}));
  goalDist=worldgen.flood(hotel.world,hotel.tiles,{from:hotel.goal,passable:hotelGen.passable}).dist;
  const g=cellXYZ(hotel.goal);
  phone??=new THREE.Group();phone.clear();
  const table=models['hotel-nightstand'].clone();
  const handset=new THREE.Mesh(new THREE.BoxGeometry(.24,.09,.14),mat.phone);handset.position.y=.6;
  beacon??=new THREE.PointLight(0xff7040,3,6,1.6);beacon.position.y=1;
  phone.add(table,handset,beacon);
  // the phone stands on a nightstand in the first corner of the goal cell that no furniture covers
  const spot=[[.6,.6],[-.6,.6],[.6,-.6],[-.6,-.6],[0,0]].map(([dx,dz])=>[g.cx+dx,g.cz+dz]).find(([x,z])=>!colliders.some(c=>c.l===g.z&&x>c.x0-.3&&x<c.x1+.3&&z>c.z0-.3&&z<c.z1+.3))??[g.cx,g.cz];
  phone.position.set(spot[0],g.z*STOREY,spot[1]);scene.add(phone);
  const s=cellXYZ(hotel.start);pos={x:s.cx,z:s.cz+.6};layer=0;height=0;ringOn=true;
  colliders.push({l:g.z,x0:phone.position.x-.26-R,x1:phone.position.x+.26+R,z0:phone.position.z-.21-R,z1:phone.position.z+.23+R});
  $('hud').textContent=`Night ${night+1}`;
}
let colliders=[],furniture=true,near=[],roomOf=[],placed;
// Which room each cell belongs to (cells joined by room-to-room faces), -1 for corridors and stairs.
function rooms(){const {cells}=hotel.world,out=new Int32Array(cells.length).fill(-1);let n=0;
  for(const i of hotel.reached){if(out[i]>=0||hotelGen.kind(by.get(cells[i]))!=='room')continue;const q=[i];out[i]=n;
    for(let h=0;h<q.length;h++){const c=cellXYZ(q[h]);for(let d=0;d<4;d++){if(by.get(cells[q[h]]).sockets[d]!=='r')continue;const j=q[h]+DX[d]+DY[d]*hotel.world.width;if(out[j]<0){out[j]=n;q.push(j);}}}n++;}
  return out;}
// Walls don't occlude for the GPU, so furniture is drawn in blocks: each room's as one block, shown while you're in it or
// within ROOM metres (looking in through its door); corridor props in ~8 m blocks shown within CULL metres.
// (Cheap models with many materials, like the vending machine and cart, stay whole: blocks cost a draw call per material.)
const FURNITURE=['bed','lamp','nightstand','credenza','door-frame','door-leaf','art','extinguisher','grandfather','sofa','chair','armchair','side-table'],CULL=12,ROOM=8;
function cellXYZ(i){const {width,height}=hotel.world,x=i%width,y=((i/width)|0)%height,z=(i/(width*height))|0;return{x,y,z,cx:(x+.5)*CELL,cz:(y+.5)*CELL};}
function tileAt(x,y,z){const {width,height,depth}=hotel.world;if(x<0||y<0||z<0||x>=width||y>=height||z>=depth)return null;return by.get(hotel.world.cells[(z*height+y)*width+x]);}

// ---------- walking: faces from sockets, stairs as ramps ----------
function blocked(ix,iy,d,lateral){
  const a=tileAt(ix,iy,layer),b=tileAt(ix+DX[d],iy+DY[d],layer);if(!a||!b)return true;
  const s=a.sockets[d],o=b.sockets[(d+2)%4];
  if(!hotelGen.passable(s)||!hotelGen.passable(o))return true;
  return (s==='d'||o==='d')&&Math.abs(lateral)>DOOR-R;
}
function stair(){
  const ix=Math.floor(pos.x/CELL),iy=Math.floor(pos.z/CELL),t=tileAt(ix,iy,layer);if(!t)return;
  const k=hotelGen.kind(t);if(k!=='stair-low'&&k!=='stair-high'){height=layer*STOREY;return;}
  const lo=k==='stair-low'?layer:layer-1,fx=pos.x/CELL-ix,fz=pos.z/CELL-iy,p=[1-fz,fx,fz,1-fx][t.rotation??0];
  height=(lo+p)*STOREY;layer=p>.5?lo+1:lo;
}
function moveAxis(axis,delta){
  const ix=Math.floor(pos.x/CELL),iy=Math.floor(pos.z/CELL),fx=pos.x-ix*CELL,fz=pos.z-iy*CELL;
  if(axis==='x'){
    let nx=pos.x+delta;const lat=fz-H;
    if(delta>0&&nx-ix*CELL>CELL-R&&(blocked(ix,iy,1,lat)||crossBlocked(ix+1,iy,fz)))nx=ix*CELL+CELL-R;
    if(delta<0&&nx-ix*CELL<R&&(blocked(ix,iy,3,lat)||crossBlocked(ix-1,iy,fz)))nx=ix*CELL+R;
    pos.x=nx;
  }else{
    let nz=pos.z+delta;const lat=fx-H;
    if(delta>0&&nz-iy*CELL>CELL-R&&(blocked(ix,iy,2,lat)||crossBlockedZ(ix,iy+1,fx)))nz=iy*CELL+CELL-R;
    if(delta<0&&nz-iy*CELL<R&&(blocked(ix,iy,0,lat)||crossBlockedZ(ix,iy-1,fx)))nz=iy*CELL+R;
    pos.z=nz;
  }
  // inside a doorway, keep clear of the jambs
  const jx=Math.floor(pos.x/CELL),jy=Math.floor(pos.z/CELL),gx=pos.x-jx*CELL,gz=pos.z-jy*CELL,t=tileAt(jx,jy,layer);
  if(t){if((gx>CELL-R&&t.sockets[1]==='d')||(gx<R&&t.sockets[3]==='d'))pos.z=jy*CELL+H+Math.max(-(DOOR-R),Math.min(DOOR-R,gz-H));
        if((gz>CELL-R&&t.sockets[2]==='d')||(gz<R&&t.sockets[0]==='d'))pos.x=jx*CELL+H+Math.max(-(DOOR-R),Math.min(DOOR-R,gx-H));}
  for(const c of furniture?colliders:[])if(c.l===layer&&pos.x>c.x0&&pos.x<c.x1&&pos.z>c.z0&&pos.z<c.z1){
    const push=[pos.x-c.x0,c.x1-pos.x,pos.z-c.z0,c.z1-pos.z],m=Math.min(...push),k=push.indexOf(m);
    if(k===0)pos.x=c.x0;else if(k===1)pos.x=c.x1;else if(k===2)pos.z=c.z0;else pos.z=c.z1;}
}
// stepping sideways into a neighbour while hugging one of its walls
const crossBlocked=(nx,iy,fz)=>{const t=tileAt(nx,iy,layer);if(!t)return true;return (fz<R&&!hotelGen.passable(t.sockets[0]))||(fz>CELL-R&&!hotelGen.passable(t.sockets[2]));};
const crossBlockedZ=(ix,ny,fx)=>{const t=tileAt(ix,ny,layer);if(!t)return true;return (fx<R&&!hotelGen.passable(t.sockets[3]))||(fx>CELL-R&&!hotelGen.passable(t.sockets[1]));};

// ---------- sound: a ringing phone heard along the corridors ----------
let audio,ringGain,panner;
function startAudio(){
  if(audio)return;audio=new AudioContext();
  const master=audio.createGain();master.gain.value=.8;master.connect(audio.destination);
  const noise=audio.createBuffer(1,audio.sampleRate*2,audio.sampleRate),d=noise.getChannelData(0);let b=0;for(let i=0;i<d.length;i++){b=(b+.02*(Math.random()*2-1))/1.02;d[i]=b*3;}
  const hum=audio.createBufferSource();hum.buffer=noise;hum.loop=true;const lp=audio.createBiquadFilter();lp.type='lowpass';lp.frequency.value=180;const hg=audio.createGain();hg.gain.value=.12;hum.connect(lp).connect(hg).connect(master);hum.start();

  const bell=audio.createGain();bell.gain.value=0;
  for(const f of [440,480]){const o=audio.createOscillator();o.frequency.value=f;o.connect(bell);o.start();}

  const cadence=()=>{const t=audio.currentTime;for(let k=0;k<20;k++){const s=t+k*6;bell.gain.setValueAtTime(0,s);bell.gain.linearRampToValueAtTime(.25,s+.02);bell.gain.setValueAtTime(.25,s+2);bell.gain.linearRampToValueAtTime(0,s+2.04);}setTimeout(cadence,110000);};cadence();
}
function updateAudio(){
  if(!audio)return;const L=audio.listener,f=new THREE.Vector3();camera.getWorldDirection(f);
  const c=camera.position,p=phone.position;
  // Firefox has no AudioParam fields on the listener: fall back to the older setters
  if(L.positionX){L.positionX.value=c.x;L.positionY.value=c.y;L.positionZ.value=c.z;L.forwardX.value=f.x;L.forwardY.value=f.y;L.forwardZ.value=f.z;L.upX.value=0;L.upY.value=1;L.upZ.value=0;}
  else{L.setPosition(c.x,c.y,c.z);L.setOrientation(f.x,f.y,f.z,0,1,0);}
  if(panner.positionX){panner.positionX.value=p.x;panner.positionY.value=p.y+.6;panner.positionZ.value=p.z;}else panner.setPosition(p.x,p.y+.6,p.z);
  // loudness follows the walking distance through doors and corridors, not the straight line through walls
  const ix=Math.floor(pos.x/CELL),iy=Math.floor(pos.z/CELL),{width,height:h}=hotel.world,steps=goalDist[(layer*h+iy)*width+ix];
  const target=ringOn?(steps<0?.02:1/(1+Math.max(0,steps)*.28)):0;
  ringGain.gain.setTargetAtTime(target,audio.currentTime,.25);
}

// ---------- loop ----------
const controls=fps.attach($('c'),{onMenu:()=>pause()});
touch.attach(document.body,{buttons:[]});
const LINES=['"Front desk. Your room is ready." The line goes quiet, but stays open.','Static, then your own voice, reading a room number you do not recognise.','"You checked out this morning," says the clerk. "Didn\'t you?"','Someone breathes on the line and hangs up. Far off, another phone begins to ring.','"Housekeeping will be up shortly." You never asked for housekeeping.'];
function answer(){mode='menu';ringOn=false;answered++;controls.clear();document.exitPointerLock?.();
  $('title').textContent=`Night ${night+1}`;$('lead').textContent=LINES[(night+seed)%LINES.length];$('sub').textContent=`You walked ${hotel.dist[hotel.goal]} rooms deep. Tomorrow the hallways will be different.`;$('go').textContent='Sleep';$('veil').classList.remove('hidden');}
function pause(){if(mode!=='walking')return;mode='menu';controls.clear();document.exitPointerLock?.();$('go').textContent='Keep walking';$('veil').classList.remove('hidden');}
function frame(now){
  requestAnimationFrame(frame); // first, so one bad frame can't stop the game
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(mode==='walking'){
    const inp=controls.input,len=Math.hypot(inp.x,inp.z),speed=(inp.run?3.2:1.7)*dt;
    if(len>0){const sx=inp.x/Math.max(1,len)*speed,sz=inp.z/Math.max(1,len)*speed,n=Math.ceil(Math.max(Math.abs(sx),Math.abs(sz))/.1);
      for(let k=0;k<n;k++){moveAxis('x',sx/n);moveAxis('z',sz/n);stair();}}
    camera.rotation.set(inp.pitch,inp.yaw,0);
    const bob=len>0?Math.sin(now*.011)*.025:0;camera.position.set(pos.x,height+EYE+bob,pos.z);
    const p=phone.position;if(Math.hypot(pos.x-p.x,pos.z-p.z)<1.1&&Math.abs(height-p.y)<1)answer();
    beacon.intensity=ringOn?2.5+Math.sin(now*.02)*.8:.8;
  }
  const cp=camera.position,here=roomOf[(layer*hotel.world.height+Math.floor(pos.z/CELL))*hotel.world.width+Math.floor(pos.x/CELL)];
  for(const m of near){const b=m.userData.block,d=cp.distanceTo(m.boundingSphere.center)-m.boundingSphere.radius;m.visible=String(b).startsWith('room')?b==='room'+here||d<ROOM:d<CULL;}

}
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();
$('go').onclick=()=>{try{startAudio();audio.resume();}catch(e){console.warn('no audio',e);}if(answered>night){night++;buildNight();}$('veil').classList.add('hidden');mode='walking';last=performance.now();$('c').requestPointerLock?.();};
try{buildNight();$('go').disabled=false;$('go').textContent='Begin the audit';$('status').textContent=`Seed ${seed} · ?seed=${seed} for the same hotel`;}catch(e){$('status').textContent='Could not build the hotel: '+e.message;}
requestAnimationFrame(frame);
