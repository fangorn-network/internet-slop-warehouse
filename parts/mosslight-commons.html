<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mosslight Commons</title><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script><style>html,body{margin:0;height:100%;overflow:hidden;background:#294c46;color:#f1ecd6;font:14px Arial}#boot{height:100%;display:grid;place-items:center}.camp-panel{position:absolute;z-index:16;right:18px;top:16px;bottom:18px;box-sizing:border-box;width:min(425px,calc(100% - 32px));overflow:auto;touch-action:pan-y;padding:20px;background:#173b34f5;border:1px solid #adcbb477;box-shadow:0 10px 50px #102b2b80}.camp-panel[hidden]{display:none}.camp-panel h2{font:30px Georgia;margin:12px 0}.camp-panel h3{font:12px Arial;letter-spacing:.12em;text-transform:uppercase;margin-top:24px;color:#f3d797}.camp-panel p{font-size:12px;line-height:1.65;color:#d0dfcc}.camp-panel button{min-height:40px;margin:3px 4px 3px 0;text-align:left}.camp-panel button:disabled{opacity:.4}.camp-panel textarea{box-sizing:border-box;width:100%;height:65px;background:#102e29;color:#e9efd5;padding:8px;border:1px solid #658b79;font:11px monospace}.camp-status{color:#ffdf98!important}.expedition canvas.camp-map{position:absolute;right:24px;bottom:125px;width:198px;height:150px;border:1px solid #d7e6bf66;pointer-events:none;image-rendering:pixelated}.camp-open{position:absolute;z-index:11;right:24px;top:100px}@media(max-width:650px){.expedition canvas.camp-map{right:14px;top:156px;bottom:auto;width:119px;height:90px}.camp-open{right:14px;top:108px}.camp-panel{right:16px;padding:15px}} </style></head><body><div id="boot">Growing some islands…</div><script type="module">
const PARTS = {/*PARTS*/};
const ids=['homestead-kit','homestead-view','p2p-homestead','resource-inventory','recipe-book','save-codec','expedition-shell','ambient-motes','touch-controls'];
async function read(id){const r=await fetch(PARTS[id]);if(!r.ok)throw Error('Could not load '+id);return r.json();}async function logic(id){return import('data:text/javascript;charset=utf-8,'+encodeURIComponent((await read(id)).js));}
try{
 const modules=Object.fromEntries(await Promise.all(ids.map(async id=>[id,await logic(id)]))),[scenario,recipes]=await Promise.all([read('mosslight-scenario'),read('homestead-recipes')]);document.querySelector('#boot').remove();
 modules['expedition-shell'].attach(document.body,{title:'Mosslight Commons',eyebrow:'A SMALL PLACE TO MAKE YOUR OWN',accent:'#e6d49a',description:'Three islands. One wandering gardener. Gather timber, craft better tools, build bridges and make a camp. Cross to the rust island for copper, then the southeast grove for crystals. Restore the mosslight — or just build something lovely. Optional four-player P2P co-op in the camp menu.',controls:'WASD / ARROWS — explore · E — gather\nSPACE — build ahead · I — camp / craft / co-op\nR — reclaim ahead · B — restore nearby beacon\nESC — pause · SCROLL — zoom',parts:PARTS,assets:['garden-caretaker'],cameraOffset:[0,22,19],touch:{attach:(root,opts)=>modules['touch-controls'].attach(root,{...opts,buttons:[{label:'GATHER',code:'KeyE'},{label:'BUILD',code:'Space'},{label:'CAMP',code:'KeyI'}]})},build:async ctx=>{
  let selected='bridge',coop=null,connecting=false,roomStatus='Solo · no connection needed',notice='',first=true,celebrated=false;
  const kit=modules['homestead-kit'].attach(scenario,{modules,recipes,onEvent:e=>{if(e.id===(coop?.id??'solo')&&e.text){ctx.message(e.text);notice=e.text;if(e.ok)ctx.tone(480,.09,'triangle',.02);}}});
  const view=modules['homestead-view'].attach(ctx.scene,{session:kit,model:await ctx.model('garden-caretaker',1.65),actor:()=>coop?.id??'solo',selected:()=>selected});ctx.follow(view.player);
  const motes=modules['ambient-motes'].attach(ctx.scene,{count:90,area:[75,55],height:[.5,4],color:0xe9efb2,size:.045,speed:.12});
  const codec=modules['save-codec'].attach(kit,{scenario:scenario.id,validate:s=>kit.validateSnapshot(s)});
  const panel=document.createElement('section');panel.className='camp-panel';panel.hidden=true;panel.setAttribute('role','dialog');panel.setAttribute('aria-label','Camp, crafting and co-op');panel.innerHTML='<button class="close-camp">Back to the islands ×</button><h2>Your little commons</h2><p>Shared supplies. Trees give timber; gray rocks give stone. Pink minerals on the northeast island give ore; mint crystals grow southeast. Hold E to gather. Tool upgrades double yields.</p><p class="bag"></p><h3>Craft</h3><div class="recipes"></div><h3>Build ahead</h3><p>Choose a blueprint, close this menu, face a tile and press SPACE. Bridge water gaps toward the other islands. R reclaims a structure for its full cost.</p><div class="blueprints"></div><button class="restore-beacon">Restore beacon · 3 crystal, 3 copper, 8 wood</button><h3>Friends, without a game server</h3><p class="room-status"></p><p>Up to four players share a camp. Host must remain here and unpaused. Public signaling may take a moment or fail on restrictive networks; no TURN relay is configured. Leave to continue solo. Keep your room code private.</p><label for="room-code">Room code</label><textarea id="room-code" spellcheck="false" placeholder="Host a room, or paste your friend’s full code"></textarea><button class="host-room">Host camp</button><button class="join-room">Join camp</button><button class="leave-room">Leave / continue solo</button><h3>Keep this place</h3><p>Export a save and copy it somewhere safe. Saves include the camp and supplies. Restore while solo. This player has no local storage.</p><label for="camp-save">Save code</label><textarea id="camp-save" spellcheck="false"></textarea><button class="export-save">Export camp</button><button class="load-save">Restore camp</button><p class="camp-status" role="status" aria-live="polite"></p>';ctx.host.append(panel);
  const open=document.createElement('button');open.className='camp-open';open.textContent='I · Camp / craft / friends';ctx.host.append(open);
  const map=document.createElement('canvas');map.className='camp-map';map.width=264;map.height=200;map.setAttribute('aria-label','Island map. White: you. Pink: friends. Gold: beacon.');ctx.host.append(map);
  const $=s=>panel.querySelector(s),id=()=>coop?.id??'solo';
  let rendered='';
  function refresh(){const s=kit.state;$('.bag').textContent=Object.entries(s.inventory).filter(([,n])=>n).map(([k,n])=>n+' '+k).join(' · ');$('.room-status').textContent=roomStatus;$('.camp-status').textContent=notice;
   $('.host-room').disabled=$('.join-room').disabled=!!coop||connecting;$('.leave-room').disabled=!coop&&!connecting;$('.load-save').disabled=!!coop||connecting;
   const signature=JSON.stringify([s.inventory,selected,s.players[id()]?kit.recipes(id()).map(r=>r.reason):null]);if(signature===rendered)return;rendered=signature;
   $('.recipes').replaceChildren();if(s.players[id()])for(const r of kit.recipes(id())){const b=document.createElement('button');b.textContent=r.title+' · '+Object.entries(r.cost).map(([k,n])=>n+' '+k).join(', ')+(r.station?' · near '+r.station:'')+(r.reason?' ['+r.reason+']':'');b.disabled=!!r.reason;b.onclick=()=>send({type:'craft',id:r.id});$('.recipes').append(b);}
   $('.blueprints').replaceChildren();for(const spec of scenario.builds){const b=document.createElement('button');b.textContent=(selected===spec.id?'✓ ':'')+spec.title+' · '+Object.entries(spec.cost).map(([k,n])=>n+' '+k).join(', ');b.onclick=()=>{selected=spec.id;refresh();};$('.blueprints').append(b);}
   $('.host-room').disabled=$('.join-room').disabled=!!coop||connecting;$('.leave-room').disabled=!coop&&!connecting;$('.load-save').disabled=!!coop||connecting;
  }
  async function send(c){try{const r=coop?await coop.command(c):kit.command('solo',c);notice=r.text??'';if(r.text)ctx.message(r.text);refresh();}catch(e){notice='Action failed: '+e.message;refresh();}}
  function toggle(){panel.hidden=!panel.hidden;ctx.keys.clear();if(!panel.hidden){refresh();$('.close-camp').focus();}else{ctx.renderer.domElement.tabIndex=0;ctx.renderer.domElement.focus();}}
  open.onclick=toggle;$('.close-camp').onclick=toggle;panel.addEventListener('keydown',e=>{if(e.code==='Escape'){e.preventDefault();toggle();}e.stopPropagation();});
  $('.restore-beacon').onclick=()=>send({type:'beacon'});
  async function connect(isHost){if(coop||connecting)return;connecting=true;notice='Opening encrypted peer connections…';refresh();try{const transport=await logic('trystero-027');coop=modules['p2p-homestead'].attach(kit,{transport,isHost,code:$('#room-code').value,onStatus:s=>{roomStatus=s;refresh();},onChange:()=>{roomStatus='Connected · shared camp';refresh();}});refresh();const result=await coop.ready;$('#room-code').value=result.code;notice=isHost?'Copy this whole code and send it to a friend.':'Joining replaces this local camp with the host’s camp.';if(!isHost){const field=$('#room-code');field.blur();}}catch(e){await coop?.dispose();coop=null;toSolo();roomStatus='Connection failed: '+e.message;notice='Solo is ready. Try hosting again or check your network.';}finally{connecting=false;refresh();}}
  function toSolo(){const s=kit.snapshot(),p=s.players[id()]??Object.values(s.players)[0]??{x:8,z:13,dx:0,dz:1};s.players={solo:p};kit.load(s);}
  $('.host-room').onclick=()=>connect(true);$('.join-room').onclick=()=>connect(false);$('.leave-room').onclick=async()=>{if(connecting){notice='Wait for the connection attempt to finish.';refresh();return;}toSolo();await coop?.dispose();coop=null;roomStatus='Solo · this camp is yours';refresh();};
  $('.export-save').onclick=()=>{try{const f=$('#camp-save');f.value=codec.encode(kit.snapshot());f.focus();f.select();notice='Copy the selected save with Ctrl/Cmd+C.';}catch(e){notice=e.message;}refresh();};$('.load-save').onclick=()=>{if(coop||connecting)return;try{kit.load(codec.decode($('#camp-save').value));toSolo();view.update(0);notice='Camp restored.';}catch(e){notice='Could not restore: '+e.message;}refresh();};
  let gather=0,ui=0;return{reset(){if(first){first=false;}else if(!coop){kit.reset();celebrated=false;}panel.hidden=true;view.update(0);view.drawMap(map);},ambient(dt){motes.update(dt);view.update(dt);view.drawMap(map);if(coop&&!ctx.playing&&coop.isHost)roomStatus='Host paused · resume to continue camp';},update(dt){
   if(ctx.consume('KeyI'))toggle();const input=panel.hidden?ctx.input():{x:0,z:0};if(coop){if(coop.isHost&&roomStatus.startsWith('Host paused'))roomStatus='Hosting · share the whole code below';coop.update(dt,input);}else kit.update(dt,{solo:input});
   gather-=dt;if(panel.hidden){if(ctx.keys.has('KeyE')&&gather<=0){gather=.32;void send({type:'gather'});}if(ctx.consume('Space'))void send({type:'build',id:selected});if(ctx.consume('KeyR'))void send({type:'reclaim'});if(ctx.consume('KeyB'))void send({type:'beacon'});}else for(const k of ['KeyE','Space','KeyR','KeyB'])ctx.consume(k);
   const s=kit.state,near=s.players[id()]?kit.nearest(id()):null;if(s.restored&&!celebrated){celebrated=true;ctx.message('The mosslight is awake. Keep exploring and building!');ctx.tone(740,.8,'triangle',.04);}ui+=dt;if(ui>.4){ui=0;if(!panel.hidden)refresh();}
   ctx.hud({value:s.restored?'HOME':'ISLAND '+(s.players[id()]?.x>16?s.players[id()]?.z<13?'02':'03':'01'),label:coop?(coop.isHost?'HOST · ':'GUEST · ')+Object.keys(s.players).length+'/4':'SOLO · TAKE YOUR TIME',objective:s.restored?'A little place, made by you.':'Bridge the islands. Restore the mosslight.',secondary:(near?'E · '+near.kind+' · ':'')+'SPACE · '+selected+' · I · camp / craft / friends'});
  },snapshot(){return{...kit.snapshot(),position:kit.state.players[id()],selected,room:coop?{host:coop.isHost,connected:coop.connected,id:id()}:null,campOpen:!panel.hidden};},dispose(){void coop?.dispose();kit.dispose();codec.dispose();view.dispose();motes.dispose();panel.remove();open.remove();map.remove();}};
 }});
}catch(e){console.error(e);const b=document.querySelector('#boot');if(b)b.textContent='Could not open the commons. Reload to try again.';}
</script></body></html>
