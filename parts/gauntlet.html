<!doctype html>
<html><head><meta charset="utf-8">
<title>Gauntlet</title>
<meta name="description" content="Survive in a grass arena while more and more red robots chase you. Jump over them.">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#2b2140;font:14px system-ui,sans-serif}
  #hud{position:fixed;top:10px;left:12px;color:#fff;text-shadow:0 1px 2px #0008;font-weight:600;pointer-events:none}
  #msg{position:fixed;inset:0;display:grid;place-items:center;color:#fff;text-shadow:0 2px 4px #0009;font-size:22px;text-align:center;cursor:pointer;background:#0006}
  #msg small{display:block;font-size:14px;opacity:.85;margin-top:8px}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<div id="hud"></div><div id="msg">loading…</div>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import * as SkeletonUtils from "three/addons/utils/SkeletonUtils.js";

const PARTS = {/*PARTS*/};
const logic = async (id) => import("data:text/javascript;charset=utf-8," + encodeURIComponent((await (await fetch(PARTS[id])).json()).js));

const [controller, patrol, followCam, animator, gltf, grassTex, crateTex] = await Promise.all([
    logic("platformer-controller"), logic("patrol"), logic("follow-camera"), logic("clip-animator"),
    new GLTFLoader().loadAsync(PARTS["robot"]),
    new THREE.TextureLoader().loadAsync(PARTS["grass-texture"]), new THREE.TextureLoader().loadAsync(PARTS["crate-texture"]),
]);
const audio = new AudioContext();
const sounds = Object.fromEntries(await Promise.all(["jump-sound", "hit-sound"].map(async (id) =>
    [id, await audio.decodeAudioData(await (await fetch(PARTS[id])).arrayBuffer())])));
const play = (id) => { const s = audio.createBufferSource(); s.buffer = sounds[id]; s.connect(audio.destination); s.start(); };

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(55, 1, 0.1, 200);
scene.background = new THREE.Color(0x2b2140); scene.fog = new THREE.Fog(0x2b2140, 25, 60);
scene.add(new THREE.HemisphereLight(0xccbbff, 0x332211, 1.1));
const sun = new THREE.DirectionalLight(0xffeedd, 2); sun.position.set(6, 15, 8); sun.castShadow = true;
Object.assign(sun.shadow.camera, { left: -16, right: 16, top: 16, bottom: -16 }); sun.shadow.mapSize.set(2048, 2048);
scene.add(sun);

// The arena: one grass slab with crates to hide behind (the guards walk through them; you don't).
const R = 11; // half the arena's width
for (const t of [grassTex, crateTex]) { t.magFilter = THREE.NearestFilter; t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; }
const solids = [];
function block(x, y, z, w, h, d, crate = false) {
    const tex = (crate ? crateTex : grassTex).clone(); tex.repeat.set(crate ? 1 : w / 2, crate ? 1 : d / 2); tex.needsUpdate = true;
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshLambertMaterial({ map: tex }));
    m.position.set(x, y - h / 2, z); m.castShadow = m.receiveShadow = true; scene.add(m); solids.push(m);
}
block(0, 0, 0, 2 * R, 2, 2 * R);
for (const [x, z] of [[-5, -5], [5, -5], [-5, 5], [5, 5], [0, -8], [0, 8], [-8, 0], [8, 0]]) block(x, 1.2, z, 1.2, 1.2, 1.2, true);

const robot = (tint) => {
    const m = SkeletonUtils.clone(gltf.scene); m.scale.setScalar(0.35);
    m.traverse((o) => { if (o.isMesh) { o.castShadow = true; if (tint) { o.material = o.material.clone(); o.material.color.multiply(new THREE.Color(tint)); } } });
    scene.add(m); return m;
};
const player = robot();
const rand = () => new THREE.Vector3((Math.random() * 2 - 1) * (R - 1), 0, (Math.random() * 2 - 1) * (R - 1));

let over = true, start = 0, nextSpawn = 0, best = 0;
const systems = [], guards = [];
function spawn() {
    const g = robot(0xff4444), corner = [[-1, -1], [1, -1], [-1, 1], [1, 1]][guards.length % 4];
    g.position.set(corner[0] * (R - 1), 0, corner[1] * (R - 1));
    // Guards wander the arena and chase on sight; each one sees a little further than the last.
    const ai = patrol.attach(g, { points: [rand(), rand(), rand()], target: player, sight: 6 + guards.length,
        alertSpeed: 3 + guards.length * 0.2, touch: 0.8, onTouch: () => lose() });
    guards.push(g); systems.push(ai, animator.attach(g, { animations: gltf.animations, state: () => ai.alert ? "run" : "walk" }));
}
function begin() {
    for (const s of systems.splice(0)) s.dispose();
    for (const g of guards.splice(0)) g.removeFromParent();
    player.position.set(0, 0, 0);
    const ctl = controller.attach(player, { solids, camera, onJump: () => play("jump-sound"), onFall: () => lose("You fell off.") });
    systems.push(ctl, animator.attach(player, { animations: gltf.animations, state: () => ctl.state }),
        followCam.attach(camera, { target: player, offset: [0, 7, 9] }));
    over = false; start = performance.now(); nextSpawn = 0; $msg.style.display = "none";
}
function lose(why = "Caught!") {
    if (over) return;
    play("hit-sound"); over = true;
    const t = (performance.now() - start) / 1000; best = Math.max(best, t);
    $msg.innerHTML = `${why} ${t.toFixed(1)}s, ${guards.length} guards<small>best ${best.toFixed(1)}s · click to try again</small>`; $msg.style.display = "";
}

const $msg = document.getElementById("msg"), $hud = document.getElementById("hud");
$msg.innerHTML = "Gauntlet<small>WASD / arrows · Shift to run · Space to jump over them<br>a new guard every 6 seconds; how long can you last?<br><br>click to start</small>";
$msg.onclick = () => { audio.resume(); begin(); };

const fit = () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); };
addEventListener("resize", fit); fit();
camera.position.set(0, 9, 14); camera.lookAt(0, 0, 0);
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
    const dt = clock.getDelta();
    if (!over) {
        const t = (performance.now() - start) / 1000;
        if (t >= nextSpawn) { spawn(); nextSpawn += 6; }
        for (const s of systems) s.update(dt);
        $hud.textContent = `${t.toFixed(1)}s · ${guards.length} guards`;
    }
    renderer.render(scene, camera);
});
</script></body></html>
