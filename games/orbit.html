<!doctype html>
<html><head><meta charset="utf-8">
<title>Orbit</title>
<meta name="description" content="A small blue planet circling a glowing sun, with a moon circling it in turn. Scroll to zoom.">
<meta name="keywords" content="demo, planets, orbit, solar system, space">
<style>html,body{margin:0;height:100%;overflow:hidden;background:#02030a}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}</script>
</head><body><script type="module">
import * as THREE from "three";
const renderer = new THREE.WebGLRenderer({ antialias: true });
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(50, 1, 0.1, 200);
let dist = 14;
const sun = new THREE.Mesh(new THREE.SphereGeometry(1.2, 32, 16), new THREE.MeshBasicMaterial({ color: 0xffcc55 }));
scene.add(sun, new THREE.PointLight(0xffffff, 60), new THREE.AmbientLight(0x223344));
const planet = new THREE.Mesh(new THREE.SphereGeometry(0.45, 32, 16), new THREE.MeshStandardMaterial({ color: 0x3a7bd5 }));
const moon = new THREE.Mesh(new THREE.SphereGeometry(0.12, 16, 8), new THREE.MeshStandardMaterial({ color: 0xaaaaaa }));
planet.add(moon); moon.position.x = 0.9; scene.add(planet);
addEventListener("wheel", (e) => { dist = Math.min(40, Math.max(5, dist + e.deltaY * 0.01)); });
const fit = () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); };
addEventListener("resize", fit); fit();
renderer.setAnimationLoop((t) => {
    const a = t / 3000;
    planet.position.set(Math.cos(a) * 5, 0, Math.sin(a) * 5);
    planet.rotation.y = t / 4000;
    camera.position.set(0, dist * 0.5, dist); camera.lookAt(0, 0, 0);
    renderer.render(scene, camera);
});
</script></body></html>
