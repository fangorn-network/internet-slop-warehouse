<!doctype html><meta charset="utf-8"><title>Asset workshop</title><script type="importmap">{"imports":{"three":"/vendor/three/build/three.module.js","three/addons/":"/vendor/three/examples/jsm/"}}</script><body><script type="module">
import * as T from 'three';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';import{FBXLoader}from'three/addons/loaders/FBXLoader.js';import{GLTFExporter}from'three/addons/exporters/GLTFExporter.js';import{DecalGeometry}from'three/addons/geometries/DecalGeometry.js';
const loader=new GLTFLoader(),exporter=new GLTFExporter();function fit(source,height){source.updateMatrixWorld(true);const b=new T.Box3().setFromObject(source),size=b.getSize(new T.Vector3()),c=b.getCenter(new T.Vector3()),g=new T.Group();source.position.sub(new T.Vector3(c.x,b.min.y,c.z));g.add(source);g.scale.setScalar(height/size.y);g.updateMatrixWorld(true);return g;}
async function serialize(scene,animations=[]){const result=await exporter.parseAsync(scene,{binary:true,animations,onlyVisible:true});const bytes=new Uint8Array(result);let text='';for(let i=0;i<bytes.length;i+=32768)text+=String.fromCharCode(...bytes.subarray(i,i+32768));return btoa(text);}
window.workshop={async assortedTea(){const gltf=await loader.loadAsync('/warehouse-assets/ph-tea-set-01.glb'),out={};gltf.scene.updateMatrixWorld(true);for(const[kind,names,height]of [['teapot',['tea_set_01_teapot_01','tea_set_01_teapot_01_lid'],.24],['sugar-bowl',['tea_set_01_sugar_cup_01','tea_set_01_sugar_cup_01_lid'],.15],['tea-mug',['tea_set_01_cup_small_02'],.12],['square-plate',['tea_set_01_plate_large_square_01'],.025]]){const group=new T.Group();for(const name of names){const node=gltf.scene.getObjectByName(name);if(!node)throw Error(name);const c=node.clone(true);c.applyMatrix4(node.parent.matrixWorld);group.add(c);}out[kind]=await serialize(fit(group,height));}return out;},async bakeMug(){const src=await loader.loadAsync('/warehouse-assets/basemesh-mug.glb');const root=fit(src.scene,.15);root.name='coffee-mug';root.traverse(n=>{if(n.isMesh){n.geometry=n.geometry.clone();n.geometry.computeVertexNormals();n.material=new T.MeshPhysicalMaterial({color:'#eee8d9',roughness:.26,metalness:0,clearcoat:.3,clearcoatRoughness:.22});}});const result={mug:await serialize(root)};root.updateMatrixWorld(true);const box=new T.Box3().setFromObject(root),center=box.getCenter(new T.Vector3()),canvas=document.createElement('canvas');canvas.width=768;canvas.height=512;const ctx=canvas.getContext('2d');ctx.fillStyle='#244a61';ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='bold 82px Georgia';['WORLD’S','OKAYEST','NEIGHBOR'].forEach((v,i)=>ctx.fillText(v,384,115+i*128,700));const texture=new T.CanvasTexture(canvas);texture.colorSpace=T.SRGBColorSpace;const material=new T.MeshStandardMaterial({map:texture,transparent:true,polygonOffset:true,polygonOffsetFactor:-4,roughness:.7,depthWrite:false});material.name='neighbor-lettering';const scene=new T.Group();scene.add(root);const meshes=[];root.traverse(n=>{if(n.isMesh)meshes.push(n);});for(const n of meshes){const decal=new T.Mesh(new DecalGeometry(n,new T.Vector3(center.x-.035,.074,box.max.z-.006),new T.Euler(),new T.Vector3(.098,.080,.075)),material);const pos=decal.geometry.attributes.position,norm=decal.geometry.attributes.normal;for(let i=0;i<pos.count;i++){pos.setXYZ(i,pos.getX(i)+norm.getX(i)*.0006,pos.getY(i)+norm.getY(i)*.0006,pos.getZ(i)+norm.getZ(i)*.0006);}scene.add(decal);}scene.name='neighbor-mug';result['neighbor-mug']=await serialize(scene);return result;},async books(){const manager=new T.LoadingManager();manager.setURLModifier(url=>/\.(png|jpg|jpeg|tga)$/i.test(url)?'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVQIHWP4z8DwHwAFgAI/ScLbtAAAAABJRU5ErkJggg==':url);const fbx=await new FBXLoader(manager).loadAsync('./assets/workshop/book-set.fbx');const meshes=[];fbx.traverse(n=>{if(n.isMesh)meshes.push(n);});const chosen=meshes.find(n=>/book_hardcover/i.test(n.name))??meshes[0];if(!chosen)throw Error('Empty book set');fbx.updateMatrixWorld(true);const result={};for(const[kind,cover]of[['book','book_hardcover_01_cover02'],['book-alt','book_hardcover_01_cover07']]){const model=chosen.clone(true);model.applyMatrix4(chosen.parent.matrixWorld);const textures=await Promise.all([cover,'book_hardcover_01_nor_gl','book_hardcover_01_roughness'].map(n=>new T.TextureLoader().loadAsync('./assets/workshop/'+n+'.jpg')));textures[0].colorSpace=T.SRGBColorSpace;model.material=new T.MeshStandardMaterial({map:textures[0],normalMap:textures[1],roughnessMap:textures[2],roughness:.85});const root=fit(model,.27);root.name=kind;result[kind]=await serialize(root);}return{models:result,chosen:chosen.name,meshNames:meshes.map(m=>m.name)};},async extractTea(){const tea=await loader.loadAsync('/warehouse-assets/ph-tea-set-01.glb'),result={};for(const [kind,name,height]of[['mug','tea_set_01_cup_small_01',.15],['plate','tea_set_01_plate_large_circular_03',.025],['saucer','tea_set_01_saucer_circular_03',.025]]){const object=tea.scene.getObjectByName(name);if(!object)throw Error(name);object.updateWorldMatrix(true,true);const mesh=object.clone(true);mesh.applyMatrix4(object.parent.matrixWorld);const g=fit(mesh,height);g.name=kind;result[kind]=await serialize(g);if(kind==='mug'){const c=document.createElement('canvas');c.width=768;c.height=512;const ctx=c.getContext('2d');ctx.fillStyle='#244a61';ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='bold 82px Georgia';['WORLD’S','OKAYEST','NEIGHBOR'].forEach((s,i)=>ctx.fillText(s,384,120+i*125,710));const texture=new T.CanvasTexture(c);texture.colorSpace=T.SRGBColorSpace;const material=new T.MeshStandardMaterial({map:texture,transparent:true,polygonOffset:true,polygonOffsetFactor:-4,roughness:.8,depthWrite:false});g.updateMatrixWorld(true);const box=new T.Box3().setFromObject(g),center=box.getCenter(new T.Vector3());const base=[];g.traverse(n=>{if(n.isMesh)base.push(n);});for(const node of base){const geom=new DecalGeometry(node,new T.Vector3(center.x-.018,box.min.y+.077,box.max.z-.012),new T.Euler(),new T.Vector3(.10,.070,.065));const decal=new T.Mesh(geom,material);const holder=new T.Group();holder.add(decal); // Decal vertices are already in world coordinates; keep outside scaled source.
const outer=new T.Group();outer.add(g.clone(true),holder);outer.name='neighbor-mug';result['neighbor-mug']=await serialize(outer);break;}}}return result;},
async bakeGarments(){const defs=[['shirt','casual','LightBrown',.64],['trousers','casual','LightBlue',.88],['blouse','cashier','White',.64]];const result={};for(const[kind,file,materialName,height]of defs){const gltf=await loader.loadAsync('./assets/characters/'+file+'.glb'),mixer=new T.AnimationMixer(gltf.scene),clip=gltf.animations.find(c=>c.name==='Idle_Neutral')??gltf.animations.find(c=>c.name==='Idle');if(clip){mixer.clipAction(clip).play();mixer.update(.1);}gltf.scene.updateMatrixWorld(true);const root=new T.Group();gltf.scene.traverse(node=>{if(!node.isMesh||node.material.name!==materialName)return;const geometry=node.geometry.clone(),positions=geometry.attributes.position;for(let i=0;i<positions.count;i++){const v=new T.Vector3().fromBufferAttribute(positions,i);if(node.isSkinnedMesh)node.applyBoneTransform(i,v);v.applyMatrix4(node.matrixWorld);positions.setXYZ(i,v.x,v.y,v.z);}geometry.deleteAttribute('skinIndex');geometry.deleteAttribute('skinWeight');geometry.computeVertexNormals();const uv=new Float32Array(positions.count*2);for(let i=0;i<positions.count;i++){uv[i*2]=positions.getX(i)*.6;uv[i*2+1]=positions.getY(i)*.6;}geometry.setAttribute('uv',new T.BufferAttribute(uv,2));const material=new T.MeshStandardMaterial({color:'#c0bbb0',roughness:.95,side:T.DoubleSide});root.add(new T.Mesh(geometry,material));});if(!root.children.length)throw Error('No garment material '+materialName);const g=fit(root,height);g.scale.z*=.27;g.name=kind;result[kind]=await serialize(g);}return result;},
async cat(){const object=await new FBXLoader().loadAsync('./assets/workshop/cat.fbx');const clips=object.animations;const details={clips:clips.map(c=>({name:c.name,duration:c.duration})),materials:[]};object.traverse(n=>{if(n.isMesh){n.frustumCulled=false;details.materials.push(...(Array.isArray(n.material)?n.material:[n.material]).map(m=>m.name));}});const group=fit(object,.53);group.name='animated-cat';return{data:await serialize(group,clips),details};}};
</script>
