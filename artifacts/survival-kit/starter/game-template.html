<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>No Road Home</title><meta name="description" content="A data-driven 3D survival starter: scavenge, craft, distract noise-aware visitors, repair a radio and escape. Includes portable saves."><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script><style>html,body{margin:0;height:100%;overflow:hidden;background:#172a23;color:#dce5cc;font:14px Arial}#boot{position:fixed;inset:0;display:grid;place-items:center}</style></head><body><div id="boot">Opening the town…</div><script type="module">
const PARTS = {/*PARTS*/};
const scenarioId='no-road-home-scenario';
const ids=['survival-kit','seeded-random','grid-navigation','perception-brain','recipe-book','objective-journal','save-codec','health','resource-inventory','survival-town-view','expedition-shell','ambient-motes','touch-controls'];
async function read(id){const r=await fetch(PARTS[id]);if(!r.ok)throw Error('Could not load '+id);return r.json();}
async function logic(id){return import('data:text/javascript;charset=utf-8,'+encodeURIComponent((await read(id)).js));}
try{
 const modules=Object.fromEntries(await Promise.all(ids.map(async id=>[id,await logic(id)])));
 const [scenario,recipes]=await Promise.all([read(scenarioId),read('survival-recipe-pack')]);document.title=scenario.title;document.getElementById('boot').remove();
 modules['expedition-shell'].attach(document.body,{title:scenario.title,eyebrow:'SURVIVAL KIT / A TOWN THAT REMEMBERS',accent:'#d9c591',description:scenario.description+' Find the fuse, repair the radio, wait for rescue and leave by the south road.',controls:'WASD / ARROWS — move · SHIFT — run · C — creep\nE — use · SPACE — crowbar · I — pack / save\nF — medicine · Q — decoy · B — brace door\nESC — pause · SCROLL — camera distance',parts:PARTS,assets:['garden-caretaker','ph-wooden-crate-01','ph-vintage-oil-lamp'],cameraOffset:[0,19,17],touch:{attach:(root,opts)=>modules['touch-controls'].attach(root,{...opts,buttons:[{label:'USE',code:'KeyE'},{label:'SWING',code:'Space'},{label:'PACK',code:'KeyI'}]})},build:async ctx=>{
  const kit=modules['survival-kit'].attach(scenario,{modules,recipes,onEvent:e=>{ctx.message(e.text);if(e.type==='hurt')ctx.tone(90,.12,'sawtooth',.02);if(e.type==='loot'||e.type==='objective')ctx.tone(520,.14,'triangle');if(e.type==='death')ctx.finish('The visitors found you. Retry, or restore a save from your pack.',false);if(e.type==='victory')ctx.finish('You got out. '+Math.floor(kit.state.age)+' seconds in town; '+kit.state.kills+' visitors silenced. Change the scenario file to build the next town.');if(panel)panel.querySelector('.pack-status').textContent=e.text;}});
  let panel=null,creep=false;
  const models={player:await ctx.model('garden-caretaker',1.7),cache:await ctx.model('ph-wooden-crate-01',1.15,'max'),lamp:await ctx.model('ph-vintage-oil-lamp',1)};
  const view=modules['survival-town-view'].attach(ctx.scene,{session:kit,models});ctx.follow(view.player);
  const dust=modules['ambient-motes'].attach(ctx.scene,{count:100,area:[52,46],height:[1,5],color:0xb4c4a2,size:.055,speed:.1});
  const codec=modules['save-codec'].attach(kit,{scenario:scenario.id,validate:s=>kit.validateSnapshot(s)});
  const style=document.createElement('style');style.textContent='.pack{position:absolute;z-index:15;right:24px;top:20px;bottom:24px;width:min(410px,calc(100% - 32px));overflow:auto;background:#14291ff5;border:1px solid #cbd8ad66;padding:20px;box-shadow:0 10px 60px #0008;touch-action:pan-y}.pack[hidden]{display:none}.pack h2{font:28px Georgia;margin:4px 0 14px}.pack h3{font:12px Arial;text-transform:uppercase;letter-spacing:.1em;color:#d4c28f;margin:23px 0 10px}.pack p{font-size:12px;line-height:1.6;color:#bacab2}.pack button{margin:3px 4px 3px 0;text-align:left;min-height:38px}.pack button:disabled{opacity:.4;cursor:default}.pack textarea{display:block;width:100%;height:90px;background:#102218;color:#d9e5cd;border:1px solid #607354;font:10px monospace;padding:10px;resize:vertical}.pack-status{color:#e6cf8c!important}.expedition canvas.survival-map{position:absolute;right:30px;bottom:130px;width:162px;height:138px;image-rendering:pixelated;border:1px solid #c1d0a34f;background:#17271f;pointer-events:none}@media(max-width:650px){.expedition canvas.survival-map{right:16px;top:150px;bottom:auto;width:108px;height:92px}.pack{top:12px;bottom:12px;right:16px;padding:16px}}';ctx.host.append(style);
  panel=document.createElement('section');panel.className='pack';panel.hidden=true;panel.setAttribute('role','dialog');panel.setAttribute('aria-labelledby','pack-title');panel.innerHTML='<button class="pack-close">Close pack ×</button><h2 id="pack-title">Your pack</h2><p>Time pauses while this is open.</p><p class="pack-items"></p><div class="pack-use"></div><h3>Make something useful</h3><div class="pack-recipes"></div><h3>Shelter stash</h3><p>Deposit with E at the shelter. Withdraw here while nearby.</p><div class="pack-stash"></div><h3>Portable save</h3><p>Export, then copy the code somewhere safe. Paste it here and restore to continue later. The warehouse player cannot keep local saves.</p><label for="save-code">Save code</label><textarea id="save-code" spellcheck="false"></textarea><button class="pack-export">Export run</button><button class="pack-load">Restore run</button><p class="pack-status" role="status" aria-live="polite"></p>';ctx.host.append(panel);
  const minimap=document.createElement('canvas');minimap.className='survival-map';minimap.width=216;minimap.height=184;minimap.setAttribute('aria-label','Town map: your position is pale yellow, objectives are outlined, alerted visitors are red.');ctx.host.append(minimap);
  const refresh=()=>{const s=kit.state;panel.querySelector('.pack-items').textContent='Health '+Math.ceil(s.hp)+' · Pack '+Object.values(s.inventory).reduce((a,b)=>a+b,0)+'/'+scenario.capacity+'\n'+Object.entries(s.inventory).filter(([,n])=>n).map(([k,n])=>k+': '+n).join(' · ');const actions=panel.querySelector('.pack-use');actions.replaceChildren();for(const [label,disabled,action]of [['Use medicine',!s.inventory.medicine||s.hp>=100,()=>kit.heal()],['Throw decoy',!s.inventory.decoy,()=>kit.decoy()],['Brace nearby door',!s.inventory.barricade,()=>kit.brace()],['Creep: '+(creep?'ON':'OFF'),false,()=>{creep=!creep;} ]]){const button=document.createElement('button');button.textContent=label;button.disabled=disabled;button.onclick=()=>{action();refresh();};actions.append(button);}const list=panel.querySelector('.pack-recipes');list.replaceChildren();for(const r of kit.recipes()){const b=document.createElement('button');b.textContent=r.title+' · '+Object.entries(r.cost).map(([k,n])=>n+' '+k).join(', ')+(r.station?' ['+r.station+']':'');b.disabled=!!r.reason;b.onclick=()=>{kit.craft(r.id);refresh();};list.append(b);}const stash=panel.querySelector('.pack-stash');stash.replaceChildren();for(const[k,n]of Object.entries(s.stash).filter(([,n])=>n)){const b=document.createElement('button');b.textContent='Take '+k+' ('+n+')';b.onclick=()=>{if(!kit.withdraw(k))panel.querySelector('.pack-status').textContent='Stand by the shelter stash to withdraw supplies.';refresh();};stash.append(b);}if(!stash.childNodes.length)stash.textContent='Empty';};
  const toggle=()=>{panel.hidden=!panel.hidden;ctx.keys.clear();if(!panel.hidden){refresh();panel.querySelector('.pack-close').focus();}};
  panel.querySelector('.pack-close').onclick=toggle;
  panel.addEventListener('keydown',e=>{if(e.code==='Escape'){e.preventDefault();toggle();}e.stopPropagation();});
  panel.querySelector('.pack-export').onclick=()=>{try{const field=panel.querySelector('textarea');field.value=codec.encode(kit.snapshot());field.focus();field.select();panel.querySelector('.pack-status').textContent='Run exported. Copy the selected code with Ctrl/Cmd+C.';}catch(e){panel.querySelector('.pack-status').textContent=e.message;}};
  panel.querySelector('.pack-load').onclick=()=>{try{kit.load(codec.decode(panel.querySelector('textarea').value));view.update(0);view.drawMap(minimap);refresh();}catch(e){panel.querySelector('.pack-status').textContent='Could not restore: '+e.message;}};
  return{reset(){kit.reset();creep=false;panel.hidden=true;view.update(0);view.drawMap(minimap);},ambient(dt){dust.update(dt);},update(dt){
   if(ctx.consume('KeyI'))toggle();if(!panel.hidden){for(const k of ['KeyE','Space','KeyQ','KeyF','KeyB'])ctx.consume(k);return;}
   if(ctx.consume('KeyE')){const near=kit.nearest();if(near?.type==='bench')toggle();else kit.interact();}if(ctx.consume('Space'))kit.attack();if(ctx.consume('KeyF'))kit.heal();if(ctx.consume('KeyQ'))kit.decoy();if(ctx.consume('KeyB'))kit.brace();
   const input=ctx.input();kit.update(dt,{...input,run:input.boost,crouch:creep||ctx.keys.has('KeyC')});view.update(dt);view.drawMap(minimap);const s=kit.state,near=kit.nearest();
   ctx.hud({value:Math.ceil(s.hp)+' HP',label:(s.night?'NIGHT':'DAY')+' · stamina '+Math.ceil(s.stamina),objective:s.objectives[0]?.title??'You found a way out.',secondary:(near?'E · '+near.title+' · ':'')+'Ward '+Math.ceil(s.wardFuel)+'s · '+(s.radioPowered?'Road opens in '+Math.ceil(s.radioRemaining)+'s':'I opens crafting, supplies and save codes')});
  },snapshot(){const s=kit.state;return{world:scenario.id,position:[s.player.position.x,0,s.player.position.z],health:s.hp,inventory:s.inventory,age:s.age,objectives:s.completed,escaped:s.escaped,radioPowered:s.radioPowered,rescueReady:s.rescueReady,doors:s.doors,looted:s.looted,enemies:s.enemies.map(e=>({id:e.id,hp:e.hp,mode:e.mode,position:e.position})),locations:kit.locations.map(l=>({id:l.id,type:l.type,position:l.position})),packOpen:!panel.hidden};},dispose(){codec.dispose();dust.dispose();view.dispose();kit.dispose();panel.remove();minimap.remove();style.remove();}};
 }});
}catch(error){const boot=document.getElementById('boot');if(boot)boot.textContent='Could not load this town. Please reload.';console.error(error);}
</script></body></html>
