<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lunar Lost Property</title><meta name="description" content="A magnetic salvage tug returns improbable household objects to a depot under a ringed planet."><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#142320;color:#e2e7d2;font:14px Arial}#boot{position:fixed;inset:0;display:grid;place-items:center;letter-spacing:.08em}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script></head><body><div id="boot" role="status">Opening the world…</div><script type="module">
import * as THREE from 'three';
const PARTS = {"expedition-shell":"https://ipfs-test.fangorn.network/ipfs/bafkreia7e3czgfc3ayugvo3q4kpilwmkta57qbvarttuhgkba6yz6inure","world-lunar-yard":"https://ipfs-test.fangorn.network/ipfs/bafkreibrvbux6eadjpww5oafp4vvbobfxnrbfz67jqeo5utzsry2w6h2ee","inertial-drive":"https://ipfs-test.fangorn.network/ipfs/bafkreicyvzo3p3czhk444lflmtm3yepfaliw42qwcdsx5ngeqqptzu7t2y","spring-tether":"https://ipfs-test.fangorn.network/ipfs/bafkreig7q52wnrcvdzq4ck64lmv26kcd7pxnr5wv2mcag7d3fx5bn5pszi","ambient-motes":"https://ipfs-test.fangorn.network/ipfs/bafkreiagmkd36o4beczofxhuwsr2lw4q46gbibisbrrsxniv75dn4iereu","touch-controls":"https://ipfs-test.fangorn.network/ipfs/bafkreie6f27cac6h4vhzqm3rjrtwue5f2ikq5vcw2kzgs3v4xadyha5pqu","magnetic-salvage-tug":"https://ipfs-test.fangorn.network/ipfs/bafkreiaxzly3tnqvs4s4tstznhcqyfed3vj573otv7okcfq6gll62bdsqm","ph-boombox":"https://ipfs-test.fangorn.network/ipfs/bafybeihlrhy63fhn2kxwq7ub5spjdhllhzgt7nsyveqxhxn3frxqmylyzu","ph-vintage-suitcase":"https://ipfs-test.fangorn.network/ipfs/bafybeifjbzzbxu4bl5fzclwc6rtdwms4etelt2ano3owi5nntr3cg2louy","ph-watering-can-metal-01":"https://ipfs-test.fangorn.network/ipfs/bafybeifx2pei2qcylqi4raph7iezooxfihyrhdxrerxf32dm2zzj5nzb7y","ph-plastic-monobloc-chair-01":"https://ipfs-test.fangorn.network/ipfs/bafybeih6xwdzpeab4gqpecdkdfobh5atgjhp34c5kaeazm42jajf3rasca","ph-ceramic-vase-03":"https://ipfs-test.fangorn.network/ipfs/bafybeiemn7z3q7w2osgjvrm4iorzp5vipzm6byu46hdtw4tb45qkyt2drq","ph-antique-katana-01":"https://ipfs-test.fangorn.network/ipfs/bafybeicwj3dtnoksvs5l23qankd7rfgfbkadhwwvufiiy4cbh6xalwty44","ph-metal-tool-chest":"https://ipfs-test.fangorn.network/ipfs/bafybeidcsgbtzwvvmqrpljlktjtlkh5xic24i3rrqm5kwjgv7lcawo5vyi","ph-vintage-oil-lamp":"https://ipfs-test.fangorn.network/ipfs/bafybeigpbkkw2wn3daaf4ggfddu6aexqj7gj7nyjjvvl3nbklhidvsqozy"};
async function logic(id){const r=await fetch(PARTS[id]);if(!r.ok)throw Error('Could not load '+id);return import('data:text/javascript;charset=utf-8,'+encodeURIComponent((await r.json()).js));}
function plaque(text,color='#e7efc9'){
 const c=document.createElement('canvas');c.width=640;c.height=128;const x=c.getContext('2d');x.fillStyle='#132522df';x.fillRect(0,0,640,128);x.strokeStyle=color;x.lineWidth=3;x.strokeRect(2,2,636,124);x.font='30px Arial';x.textAlign='center';x.fillStyle=color;x.fillText(text,320,77);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true,depthWrite:false}));s.scale.set(5.5,1.1,1);return s;
}
function bearing(a,b){const dx=b.x-a.x,dz=b.z-a.z;return ['N','NE','E','SE','S','SW','W','NW'][(Math.round(Math.atan2(dx,-dz)/(Math.PI/4))+8)%8]+' · '+Math.round(Math.hypot(dx,dz))+'m';}
function material(color,emissive=0){return new THREE.MeshStandardMaterial({color,emissive,emissiveIntensity:.8,metalness:.5,roughness:.3});}
function ring(parent,x,z,color,radius=2.2){const r=new THREE.Mesh(new THREE.TorusGeometry(radius,.075,10,64),new THREE.MeshBasicMaterial({color}));r.rotation.x=Math.PI/2;r.position.set(x,.2,z);parent.add(r);return r;}

try{
 const [shell,world,drive,tether,motes,touch]=await Promise.all(['expedition-shell','world-lunar-yard','inertial-drive','spring-tether','ambient-motes','touch-controls'].map(logic));
 document.getElementById('boot').remove();
 const ids=['ph-boombox','ph-vintage-suitcase','ph-watering-can-metal-01','ph-plastic-monobloc-chair-01','ph-ceramic-vase-03','ph-antique-katana-01'];
 shell.attach(document.body,{title:'Lunar Lost Property',eyebrow:'DEPARTMENT OF THINGS LEFT BEHIND',accent:'#f1c18c',description:'Six objects. One magnetic tug. Absolutely no sensible reason for any of this to be on the moon. Tow the lost property into the green depot. The tether has a little give. So should you.',controls:'WASD / ARROWS — move · SHIFT — boost\nE — attach / release magnet\nSCROLL — camera distance · ESC — pause',parts:PARTS,assets:['magnetic-salvage-tug',...ids,'ph-metal-tool-chest','ph-vintage-oil-lamp'],touch,cameraOffset:[0,9,22],build:async ctx=>{
  const place=world.attach(ctx.scene),field=motes.attach(ctx.scene,{count:260,area:[140,140],height:[4,45],color:0xe8d8bc,size:.065,speed:.06});
  const tug=await ctx.model('magnetic-salvage-tug',1.9);ctx.scene.add(tug);ctx.follow(tug);
  const names=['Someone’s mixtape','A suspiciously heavy suitcase','The last watering can','Chair, owner unknown','One perfectly good vase','Ceremonial lost sword'];
  const starts=[[-16,-12],[15,-13],[-20,5],[19,7],[-8,20],[12,22]],items=[],labels=[],tethers=[];let held=null,delivered=0,clock=0;
  const lineGeo=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(),new THREE.Vector3()]);const line=new THREE.Line(lineGeo,new THREE.LineBasicMaterial({color:0xc4edb7,transparent:true,opacity:.8}));line.frustumCulled=false;ctx.scene.add(line);
  const haulPoint=new THREE.Vector3();
  for(let i=0;i<ids.length;i++){
   const item=await ctx.model(ids[i],i===3?2.2:1.7,'max');item.userData.delivered=false;item.userData.index=i;ctx.scene.add(item);items.push(item);
   const label=plaque(String(i+1).padStart(2,'0')+' / LOST PROPERTY','#ebcc9a');ctx.scene.add(label);labels.push(label);
   tethers.push(tether.attach(item,{target:()=>held===item?haulPoint:null,maxDistance:13,stiffness:20,damping:7,onBreak:()=>{if(held===item){held=null;ctx.message('Magnet lost contact. Circle back for it.');}}}));
  }
  const tool=await ctx.model('ph-metal-tool-chest',1.8,'max');tool.position.set(5.5,.1,-3.5);ctx.scene.add(tool);const lamp=await ctx.model('ph-vintage-oil-lamp',1);lamp.position.set(-4,.1,-4);ctx.scene.add(lamp);
  const depotLabel=plaque('RETURN TO SENDER','#c4edb7');depotLabel.position.set(0,5.8,0);ctx.scene.add(depotLabel);
  const motor=drive.attach(tug,{input:ctx.input,speed:6.2,acceleration:4,drag:4,bounds:place.bounds,obstacles:place.obstacles,onImpact:()=>ctx.tone(90,.04,'triangle',.01)});
  function reset(){held=null;delivered=0;motor.stop();tug.position.copy(place.spawn);tug.position.y=.15;tug.rotation.y=Math.PI;items.forEach((item,i)=>{item.userData.delivered=false;item.position.set(starts[i][0],.4,starts[i][1]);item.rotation.set(0,i*.8,0);tethers[i].update(.01);labels[i].visible=true;});line.visible=false;ctx.hud({value:'0 / 6',label:'objects reunited',objective:'Find a tagged object. Press E nearby.',secondary:'Tow it into the green circle. Take your time.'});}
  return{reset,ambient(dt){place.update(dt);field.update(dt);clock+=dt;},update(dt){
   motor.update(dt);tug.position.y=.15+Math.sin(clock*2)*.05;
   haulPoint.set(0,.9,-3).applyAxisAngle(new THREE.Vector3(0,1,0),tug.rotation.y).add(tug.position);
   let nearest=null,best=4.8;for(const item of items)if(!item.userData.delivered){const d=item.position.distanceTo(tug.position);if(d<best){nearest=item;best=d;}}
   if(ctx.consume('KeyE')){if(held){held=null;ctx.message('Magnet released.');}else if(nearest){held=nearest;ctx.message('Attached: '+names[nearest.userData.index]);ctx.tone(340,.18,'triangle');}else ctx.message('Move close to a tagged object, then press E.');}
   tethers.forEach(s=>s.update(dt));
   for(let i=0;i<items.length;i++){const o=items[i];labels[i].position.copy(o.position).add(new THREE.Vector3(0,2.8,0));if(!o.userData.delivered&&held!==o){o.position.y=.4+Math.sin(clock*1.3+i)*.07;o.rotation.y+=dt*.09;}}
   if(held&&Math.hypot(held.position.x,held.position.z)<3.6&&Math.hypot(tug.position.x,tug.position.z)<4.5){
    const item=held;held=null;item.userData.delivered=true;labels[item.userData.index].visible=false;const a=delivered/6*Math.PI*2;item.position.set(Math.cos(a)*2.4,.3,Math.sin(a)*2.4);delivered++;ctx.tone(400+delivered*75,.25,'triangle');ctx.message(names[item.userData.index]+' — returned.');
    if(delivered===6)ctx.finish('All six objects returned. The moon is slightly less cluttered. Your shift took '+Math.round(ctx.elapsed)+' seconds. Management has no notes.');
   }
   line.visible=!!held;if(held){const p=line.geometry.attributes.position;p.setXYZ(0,tug.position.x,tug.position.y+.5,tug.position.z);p.setXYZ(1,held.position.x,held.position.y+.5,held.position.z);p.needsUpdate=true;}
   ctx.hud({value:delivered+' / 6',label:'objects reunited',objective:held?'Tow '+names[held.userData.index].toLowerCase()+' to the green depot.':nearest?'E · Attach '+names[nearest.userData.index].toLowerCase():'Find a tagged object. Press E nearby.',secondary:held?'Depot: '+bearing(tug.position,place.depot)+' · E releases.':'No clock. No enemies. Just a deeply unusual job.'});
  },snapshot(){return{world:'lunar-lost-property',position:tug.position.toArray(),held:held?.userData.index??null,delivered,items:items.map(o=>({position:o.position.toArray(),delivered:o.userData.delivered})),depot:[0,0,0],complete:delivered===6};},dispose(){motor.dispose();tethers.forEach(t=>t.dispose());field.dispose();place.dispose();line.removeFromParent();items.forEach(o=>o.removeFromParent());labels.forEach(o=>o.removeFromParent());}};
 }});
}catch(e){document.getElementById('boot')?.replaceChildren(document.createTextNode('Could not load this world. Please reload.'));console.error(e);}

</script></body></html>
